name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Vérifier et préparer le site
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier le registre
        run: node outils/verify-registry.mjs

      - name: Vérifier la cohérence du site
        run: node outils/verify-site.mjs

      - name: Préparer l'artefact
        run: |
          mkdir -p _site
          cp -R css demos tests _site/
          cp *.html robots.txt sitemap.xml CNAME _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/demos/index.html
          test -f _site/sitemap.xml

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Publier l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Déployer
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
